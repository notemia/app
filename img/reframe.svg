<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 
    Reframe App Icon
    For App Store: export as 1024x1024 PNG
    Concept: Two overlapping frames showing perspective shift
  -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0e7ff"/>
    </linearGradient>
    <!-- Subtle shadow for depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#4338ca" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners (iOS style) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner glow -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="white" stroke-width="1" opacity="0.1"/>
  
  <!-- Old frame (faded) - represents distorted/negative thinking -->
  <rect 
    x="100" y="100" 
    width="180" height="180" 
    rx="24" 
    fill="none" 
    stroke="white" 
    stroke-width="24" 
    opacity="0.35"
  />
  
  <!-- New frame (bright) - represents balanced perspective -->
  <rect 
    x="180" y="180" 
    width="200" height="200" 
    rx="28" 
    fill="none" 
    stroke="white" 
    stroke-width="28"
    filter="url(#shadow)"
  />
  
  <!-- Transformation arrow (subtle) -->
  <g opacity="0.7">
    <line x1="150" y1="150" x2="240" y2="240" stroke="white" stroke-width="14" stroke-linecap="round"/>
    <path d="M200 240 L240 240 L240 200" stroke="white" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  
  <!-- Small sparkle accent (optional, represents insight) -->
  <g transform="translate(360, 140)" opacity="0.9">
    <path d="M0 -20 L0 20 M-20 0 L20 0" stroke="white" stroke-width="8" stroke-linecap="round"/>
    <path d="M-12 -12 L12 12 M-12 12 L12 -12" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
